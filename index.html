<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيفي تيفي - البث المباشر</title>
    
    <!-- ستايل مشغل Video.js الشبيه بالمشغلات الاحترافية -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        /* حاوية المشغل لضمان التجاوب مع الجوالات */
        .video-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        /* تخصيص أبعاد المشغل */
        .video-js {
            width: 100% !important;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        /* واجهة البث المتوقف */
        .stream-offline {
            display: none; /* مخفي افتراضياً */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff4d4d;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .stream-offline span {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>الفيفي تيفي - AlfaifiTV</h1>

    <div class="video-container">
        <!-- شاشة التوقف التي تظهر عند إيقاف البث -->
        <div id="offlineScreen" class="stream-offline">
            <span>📺</span>
            البث المباشر متوقف حالياً
        </div>

        <!-- المشغل المستقل المدعوم بـ Video.js -->
        <video id="live-player" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">
                لتشغيل هذا الفيديو، يرجى تفعيل الجافا سكربت أو التحديث لمتصفح يدعم HTML5.
            </p>
        </video>
    </div>

    <!-- استدعاء مكتبات الـ JavaScript للمشغل -->
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>

    <!-- استدعاء Firebase (تأكد من استخدام إصدار الـ Compatibility لسهولة الكود) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. إعدادات Firebase الخاصة بمشروعك (استبدلها ببياناتك)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة الـ Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. تهيئة مشغل Video.js
        const player = videojs('live-player');

        // 3. الاستماع للتغييرات في Firebase Realtime Database
        // افترضنا أن الرابط مخزن تحت مسار "live_stream_url"
        const streamRef = database.ref('live_stream_url');

        streamRef.on('value', (snapshot) => {
            const streamUrl = snapshot.val();
            const offlineScreen = document.getElementById('offlineScreen');

            // فحص حالة الرابط: لو كان فارغ، أو يحتوي على كلمة off أو stop
            if (!streamUrl || streamUrl.trim() === "" || streamUrl.toLowerCase() === "off" || streamUrl.toLowerCase() === "stop") {
                
                // البث متوقف: نقوم بإيقاف المشغل وإظهار شاشة التوقف
                player.pause();
                player.src(""); // تفريغ المصدر تماماً لحل المشكلة
                offlineScreen.style.display = 'flex'; // إظهار شاشة "البث متوقف"
                console.log("تم إيقاف البث من لوحة التحكم.");
                
            } else {
                
                // البث يعمل: نخفي شاشة التوقف ونشغل الرابط الجديد
                offlineScreen.style.display = 'none';
                
                player.src({
                    src: streamUrl,
                    type: 'application/x-mpegURL' // تشغيل روابط m3u8 / HLS بسلاسة وبأعلى جودة
                });
                
                player.play().catch(error => {
                    console.log("تم تحديث الرابط بنجاح، بانتظار تفاعل المستخدم للتشغيل تلقائياً.");
                });
            }
        });
    </script>
</body>
</html>
