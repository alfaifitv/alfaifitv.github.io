<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://alfaifitv.github.io/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيفي تيفي AlfaifiTV | الموقع الرسمي لتحميل التطبيق والبث المباشر</title>
    
    <meta name="description" content="تحميل تطبيق الفيفي تيفي AlfaifiTV - أفضل تطبيق لمتابعة المباريات والأحداث الرياضية المباشرة بجودة عالية.">
    <meta name="keywords" content="الفيفي تيفي, AlfaifiTV, alfaifitv, ALFAIFITV, تطبيق الفيفي تيفي, تحميل AlfaifiTV, مباريات, بث مباشر">

    <style>
        :root { --primary-color: #8e44ad; --bg-color: #1a1a1a; --text-color: #ffffff; --card-bg: #262626; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6; }
        .main-layout { display: flex; justify-content: center; max-width: 850px; margin: auto; padding: 10px; }
        .container { flex: 1; padding: 10px; }
        header { text-align: center; padding: 30px 0; }
        .logo-img { max-width: 150px; border-radius: 15px; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); }
        .btn { display: inline-block; background-color: var(--primary-color); color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        section { margin: 30px 0; background: var(--card-bg); padding: 25px; border-radius: 10px; border-right: 4px solid var(--primary-color); }
        .player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; margin-top: 15px; }
        #clappr-player { width: 100%; height: 100%; }
        .match-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="container">
        <header>
            <img src="icon-app.png" alt="شعار الفيفي تيفي" class="logo-img">
            <h1>الفيفي تيفي - AlfaifiTV</h1>
            <a href="https://www.mediafire.com/file/s1da4kbani2spm2/AlfaifiTV.0.6.apk/file" target="_blank" class="btn">تحميل التطبيق AlfaifiTV.0.6</a>
        </header>

        <section id="schedule-section">
            <h3>جدول مباريات اليوم</h3>
            <div id="matches-container">جاري تحميل المباريات...</div>
        </section>

        <section id="live-stream-section">
            <div id="player-area-content">
                <div class="player-container"><div id="clappr-player"></div></div>
            </div>
        </section>
    </div>
</div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAngv8D7jXNFWrr0yS8fW51_3leSoot88w",
        authDomain: "alfaifitv-9f368.firebaseapp.com",
        databaseURL: "https://alfaifitv-9f368-default-rtdb.firebaseio.com",
        projectId: "alfaifitv-9f368",
        storageBucket: "alfaifitv-9f368.appspot.com",
        messagingSenderId: "689661718080",
        appId: "1:689661718080:android:81e1b47d167616966f79a5"
    };
    firebase.initializeApp(firebaseConfig);
    
    // تحميل المباريات مباشرة دون أي إعلانات
    window.onload = () => {
        firebase.database().ref('matches').on('value', (snapshot) => {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            const data = snapshot.val();
            if(data) {
                Object.keys(data).forEach(key => {
                    const match = data[key];
                    const div = document.createElement('div');
                    div.className = 'match-card';
                    div.innerHTML = `<span>${match.team_home} vs ${match.team_away}</span>`;
                    container.appendChild(div);
                });
            }
        });
    };
</script>
</body>
</html>
