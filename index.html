<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://alfaifitv.github.io/"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفيفي تيفي AlfaifiTV | الموقع الرسمي لتحميل التطبيق والبث المباشر</title>
    
    <meta name="description" content="تحميل تطبيق الفيفي تيفي AlfaifiTV - أفضل تطبيق لمتابعة المباريات والأحداث الرياضية المباشرة بجودة عالية.">
    <meta name="keywords" content="الفيفي تيفي, AlfaifiTV, alfaifitv, ALFAIFITV, تطبيق الفيفي تيفي, تحميل AlfaifiTV, مباريات, بث مباشر, مشغل مباريات">

    <style>
        :root { 
            --primary-color: #8e44ad; 
            --bg-color: #1a1a1a; 
            --text-color: #ffffff; 
            --card-bg: #262626;
            --card-hover: #2f2f2f;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; line-height: 1.6; }
        
        .main-layout { display: flex; justify-content: center; max-width: 1300px; margin: auto; gap: 20px; padding: 10px; }
        .side-ad { display: none; width: 160px; margin-top: 100px; position: sticky; top: 20px; height: fit-content; }
        .container { flex: 1; max-width: 850px; padding: 10px; }
        header { text-align: center; padding: 30px 0 20px 0; }
        h1 { color: var(--primary-color); margin-top: 10px; }
        .logo-img { max-width: 150px; border-radius: 15px; box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3); }
        .btn { display: inline-block; background-color: var(--primary-color); color: white; padding: 12px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; transition: 0.3s; margin-top: 10px; cursor: pointer; border: none; }
        .btn:hover { background-color: #732d91; transform: translateY(-2px); }
        section { margin: 30px 0; background: var(--card-bg); padding: 25px; border-radius: 10px; border-right: 4px solid var(--primary-color); }
        h2 { color: var(--primary-color); margin-top: 0; padding-bottom: 10px; }
        .section-title { background: var(--primary-color); color: #fff; padding: 8px 15px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; display: inline-block; margin-bottom: 20px; }
        .player-placeholder { text-align: center; padding: 40px 20px; color: #aaa; font-weight: bold; border: 2px dashed #444; border-radius: 8px; background: #111; }
        .player-container { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; margin-top: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #clappr-player { width: 100%; height: 100%; }
        .server-buttons-container { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .server-btn { background-color: #333; color: #fff; border: 1px solid #444; padding: 8px 18px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .server-btn:hover { background-color: #444; }
        .server-btn.active { background-color: var(--primary-color); border-color: var(--primary-color); }
        .matches-list { display: flex; flex-direction: column; gap: 15px; }
        .match-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; cursor: pointer; }
        .match-card:hover { background: var(--card-hover); border-color: var(--primary-color); }
        .match-card.selected-active { border: 1px solid var(--primary-color); background: rgba(142, 68, 173, 0.1); }
        .team { display: flex; align-items: center; gap: 12px; width: 38%; }
        .team img { width: 35px; height: 35px; object-fit: contain; }
        .match-time { font-size: 1.1rem; font-weight: bold; color: #f1c40f; }
        .live-status-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(231, 76, 60, 0.2); color: #e74c3c; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px; }
        .pulse-dot { width: 8px; height: 8px; background: #e74c3c; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 70% { transform: scale(1); opacity: 0.5; } }
        footer { text-align: center; padding: 30px 20px; font-size: 0.9rem; color: #888; border-top: 1px solid #333; margin-top: 50px; }
        @media (min-width: 1100px) { .side-ad { display: block; } }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="side-ad"></div> <div class="container">
        <header>
            <img src="icon-app.png" alt="شعار الفيفي تيفي" class="logo-img">
            <h1>الفيفي تيفي - AlfaifiTV</h1>
            <p>تجربة البث الرياضي الأكثر استقراراً</p>
            <a href="#" class="btn">تحميل التطبيق AlfaifiTV.0.6</a>
        </header>

        <section id="schedule-section">
            <div class="section-title">جدول مباريات اليوم</div>
            <div class="matches-list" id="matches-container">
                <p style="text-align: center; color: #888;">جاري تحميل قائمة المباريات من السيرفر...</p>
            </div>
        </section>

        <section id="live-stream-section">
            <div id="player-area-content">
                <div class="player-placeholder">📺 يرجى اختيار مباراة من الجدول أعلاه لبدء البث المباشر</div>
            </div>
        </section>

        <footer>
            <p>© 2026 AlfaifiTV - الموقع الرسمي</p>
        </footer>
    </div>
    
    <div class="side-ad"></div> </div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAngv8D7jXNFWrr0yS8fW51_3leSoot88w",
        authDomain: "alfaifitv-9f368.firebaseapp.com",
        databaseURL: "https://alfaifitv-9f368-default-rtdb.firebaseio.com",
        projectId: "alfaifitv-9f368",
        storageBucket: "alfaifitv-9f368.appspot.com",
        messagingSenderId: "689661718080",
        appId: "1:689661718080:android:81e1b47d167616966f79a5"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // (تم الحفاظ على منطق العمل بالكامل هنا...)
    // لقد قمت بإزالة فحص مانع الإعلانات لأنه كان يتسبب في مشاكل للمستخدمين.
    // يمكنك إعادة برمجته بسهولة إذا أردت لاحقاً.
    
    database.ref('matches').on('value', (snapshot) => {
        const matchesContainer = document.getElementById('matches-container');
        matchesContainer.innerHTML = '';
        const data = snapshot.val();
        if (!data) return;
        
        Object.keys(data).forEach((key) => {
            const match = data[key];
            const card = document.createElement('div');
            card.className = 'match-card';
            card.innerHTML = `<div>${match.team_home} vs ${match.team_away}</div>`;
            card.onclick = () => loadMatchPlayer(match);
            matchesContainer.appendChild(card);
        });
    });

    function loadMatchPlayer(match) {
        document.getElementById('player-area-content').innerHTML = `
            <div class="player-container"><div id="clappr-player"></div></div>
        `;
        new Clappr.Player({ source: match.stream_url_1, parentId: "#clappr-player", autoPlay: true });
    }
</script>
</body>
</html>
